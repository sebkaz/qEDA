[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qeda-reproducibility"
version = "0.1.0"
description = "Reference computations for quantum exploratory data analysis of tabular encodings"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pennylane>=0.40,<0.46",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
report = [
    "pillow>=10,<13",
    "reportlab>=4.2,<5",
]
[tool.setuptools.packages.find]
where = ["src"]
